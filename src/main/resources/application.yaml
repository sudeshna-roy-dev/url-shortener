server:
  port: 8084

app:
  base-url: ${APP_BASE_URL:http://localhost:8084}

spring:
  application:
    name: url-shortener

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true